[build]
  publish = "dist/public"
  command = "npm run build:static"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev:static"
  port = 8888
  targetPort = 3000
  publish = "dist/public"